<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temp Converter</title>

  <style>

  </style>
</head>
<body>
  <article class="temp-converter">
    <label for="tempbox">Enter temperature to convert:</label>
    <input class="temp-converter__input" id="tempbox" type="number">
    <button class="temp-converter__button" id="fButton">F to C</button>
    <button class="temp-converter__button" id="cButton">C to F</button>
    <p id="display" class="temp-converter__display"></p>
  </article>
  
  <script>
    const tempInput = document.getElementById('tempbox');
    const fahrButton = document.getElementById('fButton');
    const celButton = document.getElementById('cButton');
    const errorMessage = 'Please enter a valid temperature!';

    fahrButton.addEventListener('click', function() {
      const fahrNum = Number(tempInput.value);
      if (tempInput.value === '' || isNaN(fahrNum)) {
        document.getElementById('display').textContent = errorMessage;
      } else {
        const fahrToCelResult = (fahrNum - 32) * 5/9;
        const resultMessage = `${fahrNum}°F converts to ${fahrToCelResult.toFixed(1)}°C!`;
        const resultDisplay = document.getElementById('display');
        resultDisplay.textContent = resultMessage;
      }
    });
    celButton.addEventListener('click', function() {
      const celNum = Number(tempInput.value);
      if (tempInput.value === '' || isNaN(celNum)) {
        document.getElementById('display').textContent = errorMessage;
      } else {
        const celToFahrResult = (celNum * 9/5) + 32;
        const resultMessage = `${celNum}°C converts to ${celToFahrResult.toFixed(1)}°F!`;
        const resultDisplay = document.getElementById('display');
        resultDisplay.textContent = resultMessage;
      }
    });
  </script>
</body>
</html>
