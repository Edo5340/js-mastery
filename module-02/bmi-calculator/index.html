<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMI Calculator</title>

  <style>

  </style>
</head>

<body>
  <div class="bmicalculator">
    <label for="weight"></label>
    <input type="number" id="weight" class="bmicalculator__input bmicalculator__input--weight" placeholder="Enter Weight in lbs">
    <label for="height"></label>
    <input type="number" id="height" class="bmicalculator__input bmicalculator__input--height" placeholder="Enter Height in inches">
    <button id="button" class="bmicalculator__button">Calculate</button>
    <p id="display" class="bmicalculator__result"></p>
  </div>
</body>
</html>
