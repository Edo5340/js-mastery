<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Truthy-Falsy-Quiz</title>

    <style>
      .truthy-falsy-quiz__feedback-spot--correct {
        color: green;
      }
      .truthy-falsy-quiz__feedback-spot--incorrect {
        color: red;
      }
    </style>
  </head>
  <body>
    <article class="truthy-falsy-quiz">
      <div class="truthy-falsy-quiz__question-container">
        <p class="truthy-falsy-quiz__question">Is 0 Truthy or Falsy? :</p>
        <p
          id="quizboxzerofeedback"
          class="truthy-falsy-quiz__feedback-spot"
        ></p>
        <button id="quizboxzerobuttontruthy" class="truthy-falsy-quiz__button">
          Truthy
        </button>
        <button id="quizboxzerobuttonfalsy" class="truthy-falsy-quiz__button">
          Falsy
        </button>
      </div>
      <div class="truthy-falsy-quiz__question-container">
        <p class="truthy-falsy-quiz__question">Is "0" Truthy or Falsy? :</p>
        <p
          id="quizboxzerostringfeedback"
          class="truthy-falsy-quiz__feedback-spot"
        ></p>
        <button
          id="quizboxzerostringbuttontruthy"
          class="truthy-falsy-quiz__button"
        >
          Truthy
        </button>
        <button
          id="quizboxzerostringbuttonfalsy"
          class="truthy-falsy-quiz__button"
        >
          Falsy
        </button>
      </div>
      <div class="truthy-falsy-quiz__question-container">
        <p class="truthy-falsy-quiz__question">
          Is "" (empty string) Truthy or Falsy? :
        </p>
        <p
          id="quizboxemptystringfeedback"
          class="truthy-falsy-quiz__feedback-spot"
        ></p>
        <button
          id="quizboxemptystringbuttontruthy"
          class="truthy-falsy-quiz__button"
        >
          Truthy
        </button>
        <button
          id="quizboxemptystringbuttonfalsy"
          class="truthy-falsy-quiz__button"
        >
          Falsy
        </button>
      </div>
      <div class="truthy-falsy-quiz__question-container">
        <p class="truthy-falsy-quiz__question">Is "false" Truthy or Falsy? :</p>
        <p
          id="quizboxfalsestringfeedback"
          class="truthy-falsy-quiz__feedback-spot"
        ></p>
        <button
          id="quizboxfalsestringbuttontruthy"
          class="truthy-falsy-quiz__button"
        >
          Truthy
        </button>
        <button
          id="quizboxfalsestringbuttonfalsy"
          class="truthy-falsy-quiz__button"
        >
          Falsy
        </button>
      </div>
      <p class="truthy-falsy-quiz__score-display" id="quizscore"></p>
    </article>

    <script>
      const zeroFeedback = document.getElementById("quizboxzerofeedback");
      const zeroStrFeedback = document.getElementById(
        "quizboxzerostringfeedback",
      );
      const emptyStrFeedback = document.getElementById(
        "quizboxemptystringfeedback",
      );
      const falseStrFeedback = document.getElementById(
        "quizboxfalsestringfeedback",
      );
      const scoreDisplay = document.getElementById("quizscore");
      const btnZeroTruthy = document.getElementById("quizboxzerobuttontruthy");
      const btnZeroFalsy = document.getElementById("quizboxzerobuttonfalsy");
      const btnZeroStrTruthy = document.getElementById(
        "quizboxzerostringbuttontruthy",
      );
      const btnZeroStrFalsy = document.getElementById(
        "quizboxzerostringbuttonfalsy",
      );
      const btnEmptyStrTruthy = document.getElementById(
        "quizboxemptystringbuttontruthy",
      );
      const btnEmptyStrFalsy = document.getElementById(
        "quizboxemptystringbuttonfalsy",
      );
      const btnFalseStrTruthy = document.getElementById(
        "quizboxfalsestringbuttontruthy",
      );
      const btnFalseStrFalsy = document.getElementById(
        "quizboxfalsestringbuttonfalsy",
      );
      const zero = 0;
      const zeroStr = "0";
      const emptyStr = "";
      const falseStr = "false";
      const zeroAnswer = zero ? "Truthy" : "Falsy";
      const zeroStrAnswer = zeroStr ? "Truthy" : "Falsy";
      const emptyStrAnswer = emptyStr ? "Truthy" : "Falsy";
      const falseStrAnswer = falseStr ? "Truthy" : "Falsy";
      let scoreCount = 0;

      btnZeroTruthy.addEventListener("click", function () {
        zeroFeedback.textContent =
          zeroAnswer === "Truthy" ? "Correct!" : "Incorrect";
        zeroFeedback.classList.remove(
          "truthy-falsy-quiz__feedback-spot--incorrect",
        );
        zeroFeedback.classList.remove(
          "truthy-falsy-quiz__feedback-spot--correct",
        );
        zeroFeedback.classList.add(
          zeroAnswer === "Truthy"
            ? "truthy-falsy-quiz__feedback-spot--correct"
            : "truthy-falsy-quiz__feedback-spot--incorrect",
        );
        scoreCount += zeroAnswer === "Truthy" ? 1 : 0;
        scoreDisplay.textContent = `Current score: ${scoreCount}`;
        });

      btnZeroFalsy.addEventListener("click", function () {
        zeroFeedback.textContent =
          zeroAnswer === "Falsy" ? "Correct!" : "Incorrect";
        zeroFeedback.classList.remove(
          "truthy-falsy-quiz__feedback-spot--incorrect",
        );
        zeroFeedback.classList.remove(
          "truthy-falsy-quiz__feedback-spot--correct",
        );
        zeroFeedback.classList.add(
          zeroAnswer === "Falsy"
            ? "truthy-falsy-quiz__feedback-spot--correct"
            : "truthy-falsy-quiz__feedback-spot--incorrect",
        );
        scoreCount += zeroAnswer === "Falsy" ? 1 : 0;
        scoreDisplay.textContent = `Current score: ${scoreCount}`;
      });

      btnZeroStrTruthy.addEventListener("click", function () {
        zeroStrFeedback.textContent =
          zeroStrAnswer === "Truthy" ? "Correct!" : "Incorrect";
        zeroStrFeedback.classList.remove(
          "truthy-falsy-quiz__feedback-spot--incorrect",
        );
        zeroStrFeedback.classList.remove(
          "truthy-falsy-quiz__feedback-spot--correct",
        );
        zeroStrFeedback.classList.add(
          zeroStrAnswer === "Truthy"
            ? "truthy-falsy-quiz__feedback-spot--correct"
            : "truthy-falsy-quiz__feedback-spot--incorrect",
        );
        scoreCount += zeroStrAnswer === "Truthy" ? 1 : 0;
        scoreDisplay.textContent = `Current score: ${scoreCount}`;
      });

      btnZeroStrFalsy.addEventListener("click", function () {
        zeroStrFeedback.textContent =
          zeroStrAnswer === "Falsy" ? "Correct!" : "Incorrect";
        zeroStrFeedback.classList.remove(
          "truthy-falsy-quiz__feedback-spot--incorrect",
        );
        zeroStrFeedback.classList.remove(
          "truthy-falsy-quiz__feedback-spot--correct",
        );
        zeroStrFeedback.classList.add(
          zeroStrAnswer === "Falsy"
            ? "truthy-falsy-quiz__feedback-spot--correct"
            : "truthy-falsy-quiz__feedback-spot--incorrect",
        );
        scoreCount += zeroStrAnswer === "Falsy" ? 1 : 0;
        scoreDisplay.textContent = `Current score: ${scoreCount}`;
      });

      btnEmptyStrTruthy.addEventListener("click", function () {
        emptyStrFeedback.textContent =
          emptyStrAnswer === "Truthy" ? "Correct!" : "Incorrect";
        emptyStrFeedback.classList.remove(
          "truthy-falsy-quiz__feedback-spot--incorrect",
        );
        emptyStrFeedback.classList.remove(
          "truthy-falsy-quiz__feedback-spot--correct",
        );
        emptyStrFeedback.classList.add(
          emptyStrAnswer === "Truthy"
            ? "truthy-falsy-quiz__feedback-spot--correct"
            : "truthy-falsy-quiz__feedback-spot--incorrect",
        );
        scoreCount += emptyStrAnswer === "Truthy" ? 1 : 0;
        scoreDisplay.textContent = `Current score: ${scoreCount}`;
      });

      btnEmptyStrFalsy.addEventListener("click", function () {
        emptyStrFeedback.textContent =
          emptyStrAnswer === "Falsy" ? "Correct!" : "Incorrect";
        emptyStrFeedback.classList.remove(
          "truthy-falsy-quiz__feedback-spot--incorrect",
        );
        emptyStrFeedback.classList.remove(
          "truthy-falsy-quiz__feedback-spot--correct",
        );
        emptyStrFeedback.classList.add(
          emptyStrAnswer === "Falsy"
            ? "truthy-falsy-quiz__feedback-spot--correct"
            : "truthy-falsy-quiz__feedback-spot--incorrect",
        );
        scoreCount += emptyStrAnswer === "Falsy" ? 1 : 0;
        scoreDisplay.textContent = `Current score: ${scoreCount}`;
      });

      btnFalseStrTruthy.addEventListener("click", function () {
        falseStrFeedback.textContent =
          falseStrAnswer === "Truthy" ? "Correct!" : "Incorrect";
        falseStrFeedback.classList.remove(
          "truthy-falsy-quiz__feedback-spot--incorrect",
        );
        falseStrFeedback.classList.remove(
          "truthy-falsy-quiz__feedback-spot--correct",
        );
        falseStrFeedback.classList.add(
          falseStrAnswer === "Truthy"
            ? "truthy-falsy-quiz__feedback-spot--correct"
            : "truthy-falsy-quiz__feedback-spot--incorrect",
        );
        scoreCount += falseStrAnswer === "Truthy" ? 1 : 0;
        scoreDisplay.textContent = `Current score: ${scoreCount}`;
      });

      btnFalseStrFalsy.addEventListener("click", function () {
        falseStrFeedback.textContent =
          falseStrAnswer === "Falsy" ? "Correct!" : "Incorrect";
        falseStrFeedback.classList.remove(
          "truthy-falsy-quiz__feedback-spot--incorrect",
        );
        falseStrFeedback.classList.remove(
          "truthy-falsy-quiz__feedback-spot--correct",
        );
        falseStrFeedback.classList.add(
          falseStrAnswer === "Falsy"
            ? "truthy-falsy-quiz__feedback-spot--correct"
            : "truthy-falsy-quiz__feedback-spot--incorrect",
        );
        scoreCount += falseStrAnswer === "Falsy" ? 1 : 0;
        scoreDisplay.textContent = `Current score: ${scoreCount}`;
      });
    </script>
  </body>
</html>
