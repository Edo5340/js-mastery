<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Truthy-Falsy-Quiz</title>

    <style>
     

    </style>
  </head>
  <body>
    <article class="truthy-falsy-quiz">
      <div class="truthy-falsy-quiz__question-container">
        <p class="truthy-falsy-quiz__question">Is 0 Truthy or Falsy? :</p>
        <p id="quizboxzerofeedback" class="truthy-falsy-quiz__feedback-spot"></p>
        <button id="quizboxzerobuttontruthy" class="truthy-falsy-quiz__button">Truthy</button>
        <button id="quizboxzerobuttonfalsy" class="truthy-falsy-quiz__button">Falsy</button>
      </div>
      <div class="truthy-falsy-quiz__question-container">
        <p class="truthy-falsy-quiz__question">Is "0" Truthy or Falsy? :</p>
        <p id="quizboxzerostringfeedback" class="truthy-falsy-quiz__feedback-spot"></p>
        <button id="quizboxzerostringbuttontruthy" class="truthy-falsy-quiz__button">Truthy</button>
        <button id="quizboxzerostringbuttonfalsy" class="truthy-falsy-quiz__button">Falsy</button>
      </div>
      <div class="truthy-falsy-quiz__question-container">
        <p class="truthy-falsy-quiz__question">Is "" (empty string) Truthy or Falsy? :</p>
        <p id="quizboxemptystringfeedback" class="truthy-falsy-quiz__feedback-spot"></p>
        <button id="quizboxemptystringbuttontruthy" class="truthy-falsy-quiz__button">Truthy</button>
        <button id="quizboxemptystringbuttonfalsy" class="truthy-falsy-quiz__button">Falsy</button>
      </div>
      <div class="truthy-falsy-quiz__question-container">
        <p class="truthy-falsy-quiz__question">Is "false" Truthy or Falsy? :</p>
        <p id="quizboxfalsestringfeedback" class="truthy-falsy-quiz__feedback-spot"></p>
        <button id="quizboxfalsestringbuttontruthy" class="truthy-falsy-quiz__button">Truthy</button>
        <button id="quizboxfalsestringbuttonfalsy" class="truthy-falsy-quiz__button">Falsy</button>
      </div>
      <p class="truthy-falsy-quiz__score-display" id="quizscore"></p>
    </article>
  </body>
</html>
